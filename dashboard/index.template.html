<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>vainer-home · התקדמות אפיקים</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #162028;
      --ink-soft: #3d4a55;
      --muted: #6b7782;
      --line: color-mix(in srgb, var(--ink) 10%, transparent);
      --panel: color-mix(in srgb, white 72%, transparent);
      --panel-border: color-mix(in srgb, white 55%, var(--line));
      --teal: #0f7c72;
      --teal-deep: #0a524c;
      --amber: #c47b1a;
      --slate: #5b6b7a;
      --done: #0f7c72;
      --progress: #c47b1a;
      --todo: #8a96a1;
      --radius: 18px;
      --shadow: 0 18px 40px color-mix(in srgb, var(--ink) 8%, transparent);
      --font-display: "Syne", "Heebo", sans-serif;
      --font-body: "Heebo", sans-serif;
      --bg-1: #d7e8e4;
      --bg-2: #e4e9f0;
      --bg-grad: linear-gradient(165deg, #f4f7f8 0%, #e7edf1 48%, #dde8e5 100%);
      --noise-opacity: 0.35;
      --noise-blend: soft-light;
      --control-bg: color-mix(in srgb, white 70%, transparent);
      --control-border: color-mix(in srgb, var(--ink) 14%, transparent);
    }

    html[data-theme="dark"] {
      --ink: #e8eef2;
      --ink-soft: #b7c2cb;
      --muted: #8b98a4;
      --line: color-mix(in srgb, white 12%, transparent);
      --panel: color-mix(in srgb, #1a242c 82%, transparent);
      --panel-border: color-mix(in srgb, white 10%, transparent);
      --teal: #3db8ac;
      --teal-deep: #7ad4cb;
      --amber: #e0a04a;
      --slate: #9aa8b4;
      --done: #3db8ac;
      --progress: #e0a04a;
      --todo: #6d7b88;
      --shadow: 0 18px 40px color-mix(in srgb, black 35%, transparent);
      --bg-1: #1a3a36;
      --bg-2: #1c2833;
      --bg-grad: linear-gradient(165deg, #12181e 0%, #171f27 48%, #152220 100%);
      --noise-opacity: 0.22;
      --noise-blend: overlay;
      --control-bg: color-mix(in srgb, #24303a 85%, transparent);
      --control-border: color-mix(in srgb, white 14%, transparent);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--font-body);
      background:
        radial-gradient(1200px 700px at 90% -10%, var(--bg-1) 0%, transparent 55%),
        radial-gradient(900px 600px at -10% 20%, var(--bg-2) 0%, transparent 50%),
        var(--bg-grad);
      background-attachment: fixed;
      transition: background 0.35s ease, color 0.25s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: var(--noise-opacity);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.45'/%3E%3C/svg%3E");
      mix-blend-mode: var(--noise-blend);
    }

    .wrap {
      width: min(1180px, calc(100% - 2rem));
      margin-inline: auto;
      padding-block: 2.5rem 4rem;
      position: relative;
      z-index: 1;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: flex-start;
      margin-bottom: 1rem;
      animation: rise 0.55s ease both;
    }
    .toolbar button {
      appearance: none;
      border: 1px solid var(--control-border);
      background: var(--control-bg);
      color: var(--ink);
      font: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.55rem 0.9rem;
      border-radius: 10px;
      cursor: pointer;
      transition: border-color 0.2s ease, transform 0.15s ease, background 0.2s ease;
    }
    .toolbar button:hover {
      border-color: color-mix(in srgb, var(--teal) 45%, var(--control-border));
      transform: translateY(-1px);
    }
    .toolbar button:disabled {
      opacity: 0.55;
      cursor: wait;
      transform: none;
    }
    .toolbar .live-dot {
      display: inline-block;
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: var(--teal);
      margin-inline-end: 0.4rem;
      vertical-align: middle;
      box-shadow: 0 0 0 0 color-mix(in srgb, var(--teal) 50%, transparent);
      animation: pulse 1.8s ease infinite;
    }
    .toolbar .live-dot.off {
      background: var(--muted);
      animation: none;
      box-shadow: none;
    }

    /* Hero — one composition */
    .hero {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 2rem;
      align-items: center;
      min-height: min(68vh, 580px);
      padding-block: 1rem 2.5rem;
      animation: rise 0.8s ease both;
    }
    @media (max-width: 860px) {
      .hero {
        grid-template-columns: 1fr;
        min-height: auto;
        text-align: center;
      }
      .hero-gauge { justify-self: center; }
      .toolbar { justify-content: center; }
    }

    .brand {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(2.8rem, 7vw, 5.2rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
      color: var(--teal-deep);
      margin: 0 0 1rem;
    }
    .hero h2 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.35rem, 2.6vw, 1.9rem);
      font-weight: 700;
      color: var(--ink);
    }
    .hero p {
      margin: 0;
      max-width: 36ch;
      color: var(--ink-soft);
      font-size: 1.05rem;
      line-height: 1.55;
    }
    @media (max-width: 860px) {
      .hero p { margin-inline: auto; }
    }
    .meta {
      margin-top: 1.25rem;
      color: var(--muted);
      font-size: 0.88rem;
    }
    .meta a { color: var(--teal-deep); text-underline-offset: 3px; }

    .hero-gauge {
      display: grid;
      place-items: center;
      animation: rise 0.9s 0.12s ease both;
    }

    .gauge {
      --size: 240px;
      width: var(--size);
      height: var(--size);
      position: relative;
    }
    .gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .gauge .track { fill: none; stroke: color-mix(in srgb, var(--ink) 8%, transparent); stroke-width: 14; }
    .gauge .arc-ip {
      fill: none;
      stroke: var(--amber);
      stroke-width: 14;
      stroke-linecap: round;
      stroke-dasharray: var(--circ);
      stroke-dashoffset: var(--circ);
      transition: stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1);
    }
    .gauge .arc-done {
      fill: none;
      stroke: var(--teal);
      stroke-width: 14;
      stroke-linecap: round;
      stroke-dasharray: var(--circ);
      stroke-dashoffset: var(--circ);
      transition: stroke-dashoffset 1.35s 0.1s cubic-bezier(.22,1,.36,1);
    }
    .gauge-center {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      text-align: center;
      pointer-events: none;
    }
    .gauge-center .pct {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 3.2rem;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--teal-deep);
    }
    .gauge-center .label {
      margin-top: 0.35rem;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 500;
    }

    .gauge.sm { --size: 132px; }
    .gauge.sm .track,
    .gauge.sm .arc-ip,
    .gauge.sm .arc-done { stroke-width: 11; }
    .gauge.sm .gauge-center .pct { font-size: 1.7rem; }
    .gauge.sm .gauge-center .label { font-size: 0.75rem; }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-block: 0.5rem 2.75rem;
      animation: rise 0.8s 0.18s ease both;
    }
    @media (max-width: 720px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
    }
    .stat {
      padding: 1.1rem 1.15rem 1.2rem;
      border-top: 2px solid var(--line);
    }
    .stat .n {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .stat .t {
      margin-top: 0.4rem;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 500;
    }
    .stat.done .n { color: var(--teal-deep); }
    .stat.ip .n { color: var(--amber); }
    .stat.todo .n { color: var(--slate); }

    section { margin-block: 2.5rem; }
    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .section-head h3 {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 700;
    }
    .section-head p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .epic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
    }
    .epic {
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 1.15rem 1.15rem 1.25rem;
      box-shadow: var(--shadow);
      display: grid;
      gap: 0.85rem;
      justify-items: center;
      text-align: center;
      opacity: 0;
      transform: translateY(12px);
      animation: rise 0.65s ease forwards;
      transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
    }
    .epic:hover {
      transform: translateY(-3px);
      border-color: color-mix(in srgb, var(--teal) 35%, var(--panel-border));
    }
    .epic.empty { opacity: 0.72; }
    .epic-key {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .epic-key a {
      color: inherit;
      text-decoration: none;
    }
    .epic-key a:hover { color: var(--teal-deep); text-decoration: underline; }
    .epic-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.3;
      min-height: 2.6em;
    }
    .epic-counts {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem 0.75rem;
      justify-content: center;
      font-size: 0.8rem;
      color: var(--ink-soft);
      font-weight: 500;
    }
    .epic-counts span::before {
      content: "";
      display: inline-block;
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 2px;
      margin-inline-end: 0.35rem;
      vertical-align: middle;
    }
    .epic-counts .d::before { background: var(--done); }
    .epic-counts .p::before { background: var(--progress); }
    .epic-counts .t::before { background: var(--todo); }

    .epic-assignees {
      width: 100%;
      display: grid;
      gap: 0.35rem;
      text-align: start;
      border-top: 1px solid var(--line);
      padding-top: 0.75rem;
    }
    .epic-assignees .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem;
      font-size: 0.78rem;
      color: var(--ink-soft);
    }
    .epic-assignees .bar {
      grid-column: 1 / -1;
      height: 5px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--ink) 8%, transparent);
      overflow: hidden;
    }
    .epic-assignees .bar > i {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--teal), color-mix(in srgb, var(--teal) 55%, var(--amber)));
      border-radius: inherit;
      transition: width 1s cubic-bezier(.22,1,.36,1);
    }

    .assignee-list { display: grid; gap: 1rem; }
    .assignee {
      display: grid;
      grid-template-columns: 170px 1fr auto;
      gap: 1rem;
      align-items: center;
      padding: 1.1rem 1.2rem;
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      opacity: 0;
      animation: rise 0.65s ease forwards;
      transition: background 0.25s ease, border-color 0.25s ease;
    }
    @media (max-width: 720px) {
      .assignee { grid-template-columns: 1fr; gap: 0.65rem; }
    }
    .assignee-name { font-weight: 700; font-size: 1.05rem; }
    .assignee-sub {
      color: var(--muted);
      font-size: 0.82rem;
      margin-top: 0.15rem;
    }
    .stack {
      height: 14px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--ink) 7%, transparent);
      overflow: hidden;
      display: flex;
      direction: ltr;
    }
    .stack > i {
      display: block;
      height: 100%;
      width: 0;
      transition: width 1.1s cubic-bezier(.22,1,.36,1);
    }
    .stack .d { background: var(--done); }
    .stack .p { background: var(--progress); }
    .stack .t { background: var(--todo); }
    .assignee-pct {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.45rem;
      color: var(--teal-deep);
      letter-spacing: -0.03em;
      min-width: 4.5rem;
      text-align: start;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem 1.25rem;
      margin-top: 1.25rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .legend i {
      display: inline-block;
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 2px;
      margin-inline-end: 0.4rem;
      vertical-align: middle;
    }
    .legend .d { background: var(--done); }
    .legend .p { background: var(--progress); }
    .legend .t { background: var(--todo); }

    footer {
      margin-top: 3rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.85rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.25rem;
      justify-content: space-between;
    }

    .error {
      margin: 1rem 0;
      padding: 0.9rem 1rem;
      border: 1px solid color-mix(in srgb, #c45c4a 45%, var(--line));
      border-radius: 12px;
      color: #a13a2c;
      background: color-mix(in srgb, #c45c4a 10%, transparent);
      display: none;
    }
    html[data-theme="dark"] .error { color: #f0a59a; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--teal) 45%, transparent); }
      70% { box-shadow: 0 0 0 8px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }
  </style>
  <script>
    // Apply theme before paint to avoid flash
    (function () {
      try {
        var t = localStorage.getItem("vainer-home-theme");
        if (t === "dark" || t === "light") {
          document.documentElement.setAttribute("data-theme", t);
        } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.setAttribute("data-theme", "dark");
        } else {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <button type="button" id="theme-toggle" aria-label="החלף מצב תצוגה">מצב כהה</button>
      <button type="button" id="refresh-btn" hidden>רענון מ־Jira</button>
      <button type="button" id="live-status" hidden disabled>
        <span class="live-dot off" id="live-dot"></span>
        <span id="live-label">סטטי</span>
      </button>
    </div>

    <div class="error" id="error"></div>

    <header class="hero">
      <div>
        <p class="brand">vainer-home</p>
        <h2>התקדמות לפי אפיק</h2>
        <p>מבט חי על משימות הבית — כמה הושלם, מה בתנועה, ומה נשאר לכל אחראי.</p>
        <p class="meta" id="meta"></p>
      </div>
      <div class="hero-gauge" id="overall-gauge"></div>
    </header>

    <div class="stats" id="stats"></div>

    <section>
      <div class="section-head">
        <div>
          <h3>אפיקים</h3>
          <p>מד התקדמות לכל אפיק · ירוק = הושלם · כתום = בתהליך</p>
        </div>
      </div>
      <div class="epic-grid" id="epics"></div>
      <div class="legend">
        <span><i class="d"></i>Done</span>
        <span><i class="p"></i>In Progress</span>
        <span><i class="t"></i>To Do</span>
      </div>
    </section>

    <section>
      <div class="section-head">
        <div>
          <h3>לפי אחראי</h3>
          <p>פילוח משימות והתקדמות לכל assignee</p>
        </div>
      </div>
      <div class="assignee-list" id="assignees"></div>
    </section>

    <footer>
      <span>נתונים מ־Jira האישי (CAPTAIN) · לא כולל קניין עבודה</span>
      <span id="footer-gen"></span>
    </footer>
  </div>

  <script id="dashboard-data" type="application/json">
__DATA__
  </script>
  <script>
    const R = 70;
    const C = 2 * Math.PI * R;
    const LIVE = Boolean(window.DASHBOARD_LIVE);
    const REFRESH_MS = Number(window.DASHBOARD_REFRESH_MS || 60000);

    function currentTheme() {
      return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
    }

    function setTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      try { localStorage.setItem("vainer-home-theme", theme); } catch (e) {}
      const btn = document.getElementById("theme-toggle");
      if (btn) btn.textContent = theme === "dark" ? "מצב בהיר" : "מצב כהה";
    }

    function gaugeHTML(pctDone, pctWeighted, sizeClass = "", label = "הושלם") {
      const doneLen = (pctDone / 100) * C;
      const wLen = (pctWeighted / 100) * C;
      return `
        <div class="gauge ${sizeClass}" style="--circ:${C}">
          <svg viewBox="0 0 160 160" aria-hidden="true">
            <circle class="track" cx="80" cy="80" r="${R}"></circle>
            <circle class="arc-ip" cx="80" cy="80" r="${R}" data-offset="${C - wLen}"></circle>
            <circle class="arc-done" cx="80" cy="80" r="${R}" data-offset="${C - doneLen}"></circle>
          </svg>
          <div class="gauge-center">
            <div class="pct">${pctDone}%</div>
            <div class="label">${label}</div>
          </div>
        </div>`;
    }

    function animateGauges(root = document) {
      requestAnimationFrame(() => {
        root.querySelectorAll(".arc-ip, .arc-done").forEach((el) => {
          el.style.strokeDashoffset = el.dataset.offset;
        });
        root.querySelectorAll(".epic-assignees .bar > i, .stack > i").forEach((el) => {
          el.style.width = el.dataset.w;
        });
      });
    }

    function renderDashboard(DATA) {
      const o = DATA.overall;
      document.getElementById("overall-gauge").innerHTML =
        gaugeHTML(o.pct, o.pct_w, "", "מהמשימות");

      const liveNote = LIVE ? " · חי מ־Jira" : "";
      document.getElementById("meta").innerHTML =
        `עודכן ${DATA.generated}${liveNote} · <a href="${DATA.site}" target="_blank" rel="noopener">vainer-house</a> · ${o.epics} אפיקים · ${o.total} משימות`;

      document.getElementById("footer-gen").textContent = `נוצר ${DATA.generated}`;

      document.getElementById("stats").innerHTML = `
        <div class="stat"><div class="n">${o.total}</div><div class="t">סה״כ משימות</div></div>
        <div class="stat done"><div class="n">${o.done}</div><div class="t">הושלמו</div></div>
        <div class="stat ip"><div class="n">${o.ip}</div><div class="t">בתהליך</div></div>
        <div class="stat todo"><div class="n">${o.todo}</div><div class="t">לעשות</div></div>
      `;

      document.getElementById("epics").innerHTML = DATA.epics.map((e, idx) => {
        const empty = e.total === 0;
        const assignees = (e.assignees || []).map((a) => {
          const pct = a.total ? Math.round(100 * a.done / a.total) : 0;
          return `
            <div class="row">
              <span>${a.name}</span>
              <span>${a.done}/${a.total}</span>
              <div class="bar"><i data-w="${pct}%"></i></div>
            </div>`;
        }).join("");
        return `
          <article class="epic ${empty ? "empty" : ""}" style="animation-delay:${0.05 + idx * 0.04}s">
            <div class="epic-key"><a href="${DATA.site}/browse/${e.key}" target="_blank" rel="noopener">${e.key}</a></div>
            <h4 class="epic-title">${e.summary}</h4>
            ${gaugeHTML(e.pct, e.pct_w, "sm", empty ? "אין משימות" : `${e.done}/${e.total}`)}
            <div class="epic-counts">
              <span class="d">${e.done} Done</span>
              <span class="p">${e.ip} Progress</span>
              <span class="t">${e.todo} To Do</span>
            </div>
            ${assignees ? `<div class="epic-assignees">${assignees}</div>` : ""}
          </article>`;
      }).join("");

      document.getElementById("assignees").innerHTML = DATA.assignees.map((a, idx) => {
        const d = a.total ? (100 * a.done / a.total) : 0;
        const p = a.total ? (100 * a.ip / a.total) : 0;
        const t = a.total ? (100 * a.todo / a.total) : 0;
        return `
          <article class="assignee" style="animation-delay:${0.08 + idx * 0.06}s">
            <div>
              <div class="assignee-name">${a.name}</div>
              <div class="assignee-sub">${a.total} משימות · ${a.epic_count} אפיקים</div>
            </div>
            <div class="stack" title="Done / In Progress / To Do">
              <i class="d" data-w="${d}%"></i>
              <i class="p" data-w="${p}%"></i>
              <i class="t" data-w="${t}%"></i>
            </div>
            <div class="assignee-pct">${a.pct}%</div>
          </article>`;
      }).join("");

      setTimeout(() => animateGauges(), 40);
    }

    function showError(msg) {
      const el = document.getElementById("error");
      el.style.display = "block";
      el.textContent = msg;
    }

    function clearError() {
      const el = document.getElementById("error");
      el.style.display = "none";
      el.textContent = "";
    }

    async function loadData() {
      if (LIVE) {
        const res = await fetch("/api/data", { cache: "no-store" });
        if (!res.ok) throw new Error("Jira refresh failed (" + res.status + ")");
        return res.json();
      }
      return JSON.parse(document.getElementById("dashboard-data").textContent);
    }

    async function refresh(manual) {
      const btn = document.getElementById("refresh-btn");
      const dot = document.getElementById("live-dot");
      const label = document.getElementById("live-label");
      if (btn && manual) btn.disabled = true;
      try {
        const data = await loadData();
        clearError();
        renderDashboard(data);
        if (dot) {
          dot.classList.remove("off");
          label.textContent = "חי · כל " + Math.round(REFRESH_MS / 1000) + "ש׳";
        }
      } catch (err) {
        showError(String(err.message || err));
        if (dot) {
          dot.classList.add("off");
          label.textContent = "שגיאה ברענון";
        }
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    document.getElementById("theme-toggle").addEventListener("click", () => {
      setTheme(currentTheme() === "dark" ? "light" : "dark");
    });
    setTheme(currentTheme());

    if (LIVE) {
      document.getElementById("refresh-btn").hidden = false;
      document.getElementById("live-status").hidden = false;
      document.getElementById("refresh-btn").addEventListener("click", () => refresh(true));
      refresh(false);
      setInterval(() => refresh(false), REFRESH_MS);
    } else {
      renderDashboard(JSON.parse(document.getElementById("dashboard-data").textContent));
    }
  </script>
</body>
</html>
